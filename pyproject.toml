[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-search-1688"
version = "0.3.0"
description = "支持多模型供应商的 1688 智能采购对话 CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
as1688 = "agent_search_1688.cli:main"
1688-agent-search = "agent_search_1688.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_search_1688.souls" = ["*.md"]
